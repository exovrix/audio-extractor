[project]
name = "audio-extractor"
version = "0.1.0"
description = "Extract and convert audio tracks from video/audio files via ffmpeg"
authors = [
    {name = "jrb00013", email = "jrb00013wvu@gmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["audio", "ffmpeg", "extract", "wav", "mp3", "video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/exovrix/audio-extractor"
Repository = "https://github.com/exovrix/audio-extractor"
Issues = "https://github.com/exovrix/audio-extractor/issues"

[project.scripts]
audio-extractor = "audio_extractor.cli:main"

[tool.poetry]
packages = [{include = "audio_extractor", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
